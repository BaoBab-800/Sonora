name: sonora
description: "An application for convenient listening and control of music from your device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  # Больше нет моей библиотеки :(

  path_provider: ^2.1.6

  go_router: ^18.0.0

  flutter_riverpod: ^3.4.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  audio_service: ^0.18.19
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

  on_audio_query: ^2.9.0

  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/test.mp3